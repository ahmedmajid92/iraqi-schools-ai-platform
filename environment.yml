name: iraq-edu-ai
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - flask=3.0.*
  - python-dotenv=1.*
  - scikit-learn=1.*
  - numpy=1.*
  - pandas=2.*
  - pip:
      - werkzeug==3.*
      - pdfplumber>=0.10.0
      - python-docx>=1.0.0
      - google-genai>=1.0.0  # Optional: for AI quiz generation
      # Arabic NLP enhancements
      - camel-tools>=1.5.0   # Comprehensive Arabic NLP (morphology, POS, lemmatization)
      - pyarabic>=0.6.15     # Lightweight Arabic utilities (fallback)
      - gensim>=4.3.0        # Word embeddings support (for AraVec)

name: iraq-edu-ai
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - flask=3.0.*
  - python-dotenv=1.*
  - scikit-learn=1.*
  - numpy=1.*
  - pandas=2.*
  - pip:
      - werkzeug==3.*
      - pdfplumber>=0.10.0
      - python-docx>=1.0.0
      # OpenAI API (primary AI provider)
      - openai>=1.0.0
      # Arabic NLP enhancements
      - camel-tools>=1.5.0
      - pyarabic>=0.6.15
      - gensim>=4.3.0
      # Local LLM (Qwen2.5-1.5B-Instruct) - Optional
      - transformers>=4.35.0
      - huggingface-hub>=0.30.0
      - torch>=2.0.0
      - accelerate>=0.25.0
      # PDF Processing
      - pdfplumber>=0.10.0 # Keep for fallback
      - PyMuPDF>=1.23.0 # Better PDF extraction
      - pdf2image>=1.16.0 # For OCR support
      # PDF Export
      - weasyprint>=60.0
      - reportlab>=4.0.0
      # Password hashing for auth
      - bcrypt>=4.0.0
      # Text-to-Speech
      - gTTS>=2.3.0
      # Caching
      - diskcache>=5.6.0

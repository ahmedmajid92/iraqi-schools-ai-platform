{% extends "base.html" %}
{% block content %}

<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <div>
    <h2 class="fw-bold mb-1">وضع المعلم</h2>
    <div class="text-muted">تحضير درس + توليد أسئلة من نص الدرس</div>
  </div>
</div>

<div class="row g-3">
  <div class="col-lg-5">
    <div class="card rounded-4 shadow-sm">
      <div class="card-body">
        <h5 class="fw-bold mb-3">بيانات الدرس</h5>

        <div class="mb-2">
          <label class="form-label">الصف</label>
          <select class="form-select" id="tGrade">
            {% for g in curriculum.grades %}
              <option value="{{ g.grade }}">{{ g.grade }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label">المادة</label>
          <select class="form-select" id="tSubject"></select>
        </div>

        <div class="mb-2">
          <label class="form-label">عنوان الدرس</label>
          <input class="form-control" id="tTitle" placeholder="مثال: قواعد الأمن الرقمي الأساسية">
        </div>

        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">مدة الحصة (دقيقة)</label>
            <input type="number" class="form-control" id="tDuration" value="45" min="30" max="90">
          </div>
          <div class="col-md-6">
            <label class="form-label">نوع الدرس</label>
            <select class="form-select" id="tType">
              <option>شرح/مفاهيم</option>
              <option>حل مسائل</option>
              <option>قراءة وفهم</option>
            </select>
          </div>
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-primary btn-lg" onclick="teacherGeneratePlan()">إنشاء خطة الدرس</button>
        </div>

        <hr class="my-4">

        <h5 class="fw-bold mb-2">نص الدرس لتوليد الأسئلة</h5>
        <div class="mb-2">
          <label class="form-label small text-muted">رفع ملف (PDF, Word, TXT) أو الصق النص مباشرة:</label>
          <input type="file" class="form-control form-control-sm" id="tFile" accept=".pdf,.docx,.txt" onchange="uploadFile('tFile', 'tLessonText')">
        </div>
        <textarea class="form-control" id="tLessonText" rows="7" placeholder="الصق نص الدرس هنا..."></textarea>

        <div class="row g-2 mt-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label">عدد الأسئلة</label>
            <input type="number" class="form-control" id="tNumQ" value="10" min="5" max="25">
          </div>
          <div class="col-md-6 d-grid">
            <button class="btn btn-success" onclick="teacherGenerateQuiz()">توليد الأسئلة</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card rounded-4 shadow-sm mb-3">
      <div class="card-body">
        <h5 class="fw-bold">خطة الدرس</h5>
        <div id="planBox" class="mt-3 empty-state">لم يتم إنشاء خطة بعد.</div>
      </div>
    </div>

    <div class="card rounded-4 shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center">
          <h5 class="fw-bold mb-0">الأسئلة</h5>
          <div>
            <button class="btn btn-success btn-sm me-1" id="downloadQuizBtn" onclick="downloadQuiz()" style="display:none;">📥 تحميل TXT</button>
            <button class="btn btn-outline-primary btn-sm" onclick="copyQuizJson()">نسخ JSON</button>
          </div>
        </div>
        <div id="quizBox" class="mt-3 empty-state">لم يتم توليد أسئلة بعد.</div>
      </div>
    </div>
  </div>
</div>

<script id="curriculumData" type="application/json">{{ curriculum|tojson }}</script>

{% endblock %}

{% block scripts %}
<script>
  const curriculum = JSON.parse(document.getElementById("curriculumData").textContent);

  async function uploadFile(inputId, textareaId) {
    const input = document.getElementById(inputId);
    const textarea = document.getElementById(textareaId);
    const file = input.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    setBusy(true);
    try {
      const res = await fetch('/api/extract-text', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      setBusy(false);

      if (data.ok) {
        textarea.value = data.text;
        toast('تم استخراج النص من الملف.');
      } else {
        toast(data.error || 'فشل في استخراج النص.');
      }
    } catch (e) {
      setBusy(false);
      toast('خطأ في رفع الملف.');
    }
    input.value = '';  // Reset file input
  }

  function refreshTeacherSubjects(){
    const grade = document.getElementById("tGrade").value;
    const g = curriculum.grades.find(x => x.grade === grade);
    const sel = document.getElementById("tSubject");
    sel.innerHTML = "";
    (g?.subjects || []).forEach(s => {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });
  }

  document.getElementById("tGrade").addEventListener("change", refreshTeacherSubjects);
  refreshTeacherSubjects();

  let lastQuiz = null;

  async function teacherGeneratePlan(){
    const payload = {
      grade: document.getElementById("tGrade").value,
      subject: document.getElementById("tSubject").value,
      lesson_title: document.getElementById("tTitle").value,
      duration_minutes: document.getElementById("tDuration").value,
      lesson_type: document.getElementById("tType").value
    };

    setBusy(true);
    const res = await fetch("/api/teacher/lesson-plan", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    setBusy(false);

    if(!data.ok){ toast("حدث خطأ."); return; }
    renderPlan(data.plan);
    toast("تم إنشاء خطة الدرس.");
  }

  function renderPlan(plan){
    const box = document.getElementById("planBox");
    box.classList.remove("empty-state");
    box.innerHTML = `
      <div class="mb-2"><span class="badge bg-primary">المادة</span> ${escapeHtml(plan.meta.subject)}
        <span class="badge bg-secondary ms-1">الصف</span> ${escapeHtml(plan.meta.grade)}
      </div>
      <div class="fw-bold mb-2">عنوان الدرس: ${escapeHtml(plan.meta.lesson_title)}</div>

      <div class="row g-2">
        <div class="col-md-6">
          <div class="mini-card">
            <div class="fw-bold mb-2">الأهداف</div>
            <ul class="mb-0">
              ${plan.objectives.map(x => `<li>${escapeHtml(x)}</li>`).join("")}
            </ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mini-card">
            <div class="fw-bold mb-2">التقويم</div>
            <ul class="mb-0">
              ${plan.assessment.map(x => `<li>${escapeHtml(x)}</li>`).join("")}
            </ul>
          </div>
        </div>
      </div>

      <div class="mini-card mt-2">
        <div class="fw-bold mb-2">مراحل الحصة (${plan.meta.duration_minutes} دقيقة)</div>
        <ol class="mb-0">
          ${plan.phases.map(p => `<li class="mb-1"><span class="fw-semibold">${escapeHtml(p.name)}</span>
            — ${p.minutes} د — <span class="text-muted">${escapeHtml(p.desc)}</span></li>`).join("")}
        </ol>
      </div>

      <div class="row g-2 mt-2">
        <div class="col-md-6">
          <div class="mini-card">
            <div class="fw-bold mb-2">تفريد التعليم</div>
            <ul class="mb-0">
              ${plan.differentiation.map(x => `<li>${escapeHtml(x)}</li>`).join("")}
            </ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mini-card">
            <div class="fw-bold mb-2">الواجب</div>
            <ul class="mb-0">
              ${plan.homework.map(x => `<li>${escapeHtml(x)}</li>`).join("")}
            </ul>
          </div>
        </div>
      </div>
    `;
  }

  async function teacherGenerateQuiz(){
    const payload = {
      grade: document.getElementById("tGrade").value,
      subject: document.getElementById("tSubject").value,
      num_questions: document.getElementById("tNumQ").value,
      lesson_text: document.getElementById("tLessonText").value
    };

    setBusy(true);
    const res = await fetch("/api/teacher/quiz-generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    setBusy(false);

    if(!data.ok){ toast(data.error || "تعذر توليد الأسئلة."); return; }
    lastQuiz = data.quiz;
    renderQuiz(lastQuiz);
    document.getElementById('downloadQuizBtn').style.display = 'inline-block';
    toast("تم توليد الأسئلة.");
  }

  function renderQuiz(quiz){
    const box = document.getElementById("quizBox");
    box.classList.remove("empty-state");

    // Handle both NLP format (meta object) and OpenAI format (source/model directly on quiz)
    const meta = quiz.meta || {};
    const genMethod = meta.generated_by || quiz.source || quiz.model || 'AI';
    const questionCount = meta.question_count || (quiz.questions ? quiz.questions.length : 0);
    const difficulty = meta.difficulty || 'متوسط';
    const notes = quiz.notes || [];
    
    const methodBadge = genMethod.includes('openai') || genMethod.includes('gpt') ? 'bg-info' : 
                        genMethod.includes('gemini') ? 'bg-primary' : 'bg-warning text-dark';
    
    const header = `
      <div class="mb-2">
        <span class="badge bg-success">عدد الأسئلة</span> ${questionCount}
        <span class="badge bg-secondary ms-1">الصعوبة</span> ${escapeHtml(difficulty)}
        <span class="badge ${methodBadge} ms-1">التوليد: ${escapeHtml(genMethod)}</span>
      </div>
      ${notes.length > 0 ? `<div class="text-muted small mb-3">${notes.map(x=>escapeHtml(x)).join(" — ")}</div>` : ''}
    `;

    const qHtml = quiz.questions.map((q, i) => {
      let body = "";
      const qType = q.type || "اختيار من متعدد";
      const qText = q.question || q.prompt || "";
      const choices = q.choices || [];
      const correctIdx = q.answer_index ?? q.correct_index ?? 0;
      const explanation = q.explanation || "";
      
      if(qType === "اختيار من متعدد" || choices.length > 0){
        body = `<ul class="choices">
          ${choices.map((c, idx)=> `<li>${escapeHtml(c)} ${idx===correctIdx?'<span class="answer-tag">الإجابة</span>':''}</li>`).join("")}
        </ul>`;
        if(explanation) {
          body += `<div class="text-muted small mt-1">الشرح: ${escapeHtml(explanation)}</div>`;
        }
      } else if(qType === "أكمل الفراغ"){
        body = `<div class="text-muted mt-1">الإجابة: <span class="fw-semibold">${escapeHtml(q.answer)}</span></div>`;
      } else if(qType === "صح/خطأ"){
        body = `<div class="text-muted mt-1">الإجابة: <span class="fw-semibold">${escapeHtml(q.answer)}</span></div>`;
      } else {
        body = `<div class="text-muted mt-1">تلميح للمعلم: ${escapeHtml(q.answer_hint || "")}</div>`;
      }

      return `
        <div class="q-card">
          <div class="d-flex justify-content-between flex-wrap gap-2">
            <div class="fw-bold">${i+1}) <span class="badge bg-light text-dark">${escapeHtml(qType)}</span></div>
          </div>
          <div class="mt-2 pre-line">${escapeHtml(qText)}</div>
          ${body}
        </div>
      `;
    }).join("");

    box.innerHTML = header + qHtml;
  }

  function copyQuizJson(){
    if(!lastQuiz){ toast("لا يوجد أسئلة لنسخها."); return; }
    navigator.clipboard.writeText(JSON.stringify(lastQuiz, null, 2))
      .then(()=>toast("تم نسخ JSON."))
      .catch(()=>toast("تعذر النسخ."));
  }

  function downloadQuiz(){
    if(!lastQuiz || !lastQuiz.questions){ toast("لا يوجد أسئلة للتحميل."); return; }
    
    const grade = document.getElementById('tGrade').value;
    const subject = document.getElementById('tSubject').value;
    
    let content = `الأسئلة المولدة\n`;
    content += `الصف: ${grade} | المادة: ${subject}\n`;
    content += `${'='.repeat(50)}\n\n`;
    
    lastQuiz.questions.forEach((q, i) => {
      const qType = q.type || 'اختيار من متعدد';
      const qText = q.question || q.prompt || '';
      
      content += `السؤال ${i + 1} (${qType}):\n`;
      content += `${qText}\n`;
      
      if (q.choices && q.choices.length > 0) {
        const correctIdx = q.answer_index ?? q.correct_index ?? 0;
        q.choices.forEach((c, j) => {
          const marker = j === correctIdx ? '✓' : ' ';
          content += `  ${marker} ${c}\n`;
        });
        if (q.explanation) {
          content += `\n  الشرح: ${q.explanation}\n`;
        }
      } else if (q.answer) {
        content += `الإجابة: ${q.answer}\n`;
      } else if (q.answer_hint) {
        content += `تلميح: ${q.answer_hint}\n`;
      }
      content += '\n';
    });
    
    // Create and download file
    const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `أسئلة_${subject}_${grade}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('تم تحميل الأسئلة.');
  }
</script>
{% endblock %}
